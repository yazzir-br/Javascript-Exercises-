<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog</title>
    
        <link rel="stylesheet" href="Jsexercise37.css">
</head>
<body>

    <div class="container">
        <h1>Js exercise 37 </h1>

        <div class="form-container">
            <h3>Create a New Post</h3>
            <form id="blogForm">
                <input type="text" id="postTitle" placeholder="Post Title" required>
                <input type="url" id="postImage" placeholder="Image URL (optional)">
                <textarea id="postContent" placeholder="Write your post here..." rows="5" required></textarea>
                <button type="submit">Add Post</button>
            </form>
        </div>

        <hr>
        <h2>All Posts</h2>
        <div id="postsContainer"></div>
    </div>

    <script src="Js exercise 37.js"></script>
</body>
</html>
